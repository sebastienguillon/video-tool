<section class="section" aria-labelledby="silence-heading">
  <h2 id="silence-heading" class="section-title"><app-icon name="volume-x" /> Silence</h2>
  @if (removed()) {
    <p class="hint">The audio is removed: there is nothing to silence.</p>
  } @else {
    <div class="fields">
      <app-length-field
        label="Silence the start"
        describedBy="silence-note"
        [value]="recipe().silenceStart"
        (valueChange)="setSilence('silenceStart', $event)"
        (validityChange)="setValidity('silenceStart', $event)"
      />
      <app-length-field
        label="Silence the end"
        describedBy="silence-note"
        [value]="recipe().silenceEnd"
        (valueChange)="setSilence('silenceEnd', $event)"
        (validityChange)="setValidity('silenceEnd', $event)"
      />
    </div>
    <p id="silence-note" class="hint">
      Counted on the result, after the trims.
      @if (silencing()) {
        Silencing re-encodes the audio, not the video.
      }
    </p>
  }
</section>
